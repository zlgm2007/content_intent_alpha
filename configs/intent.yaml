# 意图识别 + 打分 训练/推理配置（6 分类直接打分）
#
# 本系统为「单意图强度打分器」：一次只识别一个目标意图，输出 0–5 分强度。
# 换一类意图（如从「购物」换成「售后」）只需改配置 + 重导数据 + 重训，训练/推理/导出链路全复用：
#   1. 改下方 model.intent_name 为目标意图名称（用于输出与前端展示）
#   2. 改 configs/es.yaml 的 fields.intent_score 为新意图在 ES 里的打分字段名
#   3. 重新导入 ES 数据 → 数据准备 → 训练 → 导出 ONNX
# 在线试测与前端文案会自动跟随 intent_name（通过 GET /api/intent/config 读取）。

model:
  pretrained: "voidful/albert_chinese_small"   # HuggingFace 预训练底座（中文 ALBERT 小模型）
  max_length: 320                              # 正文+评论拼接后的序列长度（原 128 已不够）
  num_labels: 6                            # 6 分类：0/1/2 无意图，3 倾向，4 中度，5 强烈
  intent_name: "购物"                      # 目标意图名称（用于输出与前端展示，换意图时改这里）

data:
  raw_dir: "data/intent/raw"                        # 原始语料（positive.txt / negative.txt / all.txt）
  labeled_file: "data/intent/labeled/train.jsonl"   # 训练标注文件 {"text": "...", "label": 0~5}
  val_file: "data/intent/labeled/val.jsonl"         # 验证标注文件（可选）
  train_split: 0.9

train:
  output_dir: "models/intent"
  epochs: 3
  batch_size: 32
  learning_rate: 0.00002            # 2e-5（避免 yaml 把 2e-5 解析成字符串，用显式小数）
  weight_decay: 0.01
  warmup_ratio: 0.1
  seed: 42

export:
  onnx_path: "models/intent/intent.onnx"
  quantize: false
  opset: 14

inference:
  # 先验偏移修正（prior shift correction）
  # 训练集做过类别平衡（1/3/5 类各截断到 20,000 条），与 es_docs 真实分布差异很大：
  #   分数   训练集   真实
  #    1     21.5%   14.5%
  #    3     21.5%   36.6%   <- 真实最多，训练里被压到 1/3
  #    5     21.5%   27.1%
  # 后果：模型系统性低判 3/5 分、高判 1/2/4 分。
  # 修正方式：logits += alpha * log(P_real / P_train)，偏置向量存于下方 prior_file。
  #   alpha = 0  -> 关闭（原始行为）
  #   alpha = 1.0 -> 完全修正（理论值；实测 0.6~1.2 表现持平，2.0 会过校正劣化）
  # 实测（1500 条 es_docs 分布样本，alpha=1.0）：准确率 +0.80pp、MAE -0.019、
  #   二分F1 +0.70pp、严重错判(0分判成5分等) 55 -> 47。
  #
  # ---------- 2026-09-01 全量留出集 alpha 扫描（13,970 条，tune/eval 奇偶半区）----------
  # scripts/sweep_intent_prior_alpha.py：logits 只算一次缓存后离线扫 alpha，
  # 「tune 半区选 alpha、eval 半区报告效果」，避免用测试数据调参的乐观偏差。
  #   tune 半区选出最优 alpha = 0.8；eval 半区（未参与选择）复现：
  #     指标        alpha=0    alpha=0.8
  #     准确率      0.7258  ->  0.7367   (+1.09pp)
  #     ±1容差      0.8352  ->  0.8415
  #     MAE         0.5775  ->  0.5585
  #     二分F1      0.8890  ->  0.8980   (+0.90pp)
  #     严重错判        563  ->     551
  #   弱类 F1 反而下降：0分 .386->.362、2分 .450->.441、4分 .569->.545
  #   —— 因为 bias 是 +0.531 给 3 分、+0.231 给 5 分，把样本往 3/5 推，0/2/4 被牺牲。
  #   但需求 10.4 已证明 0 分标签里有大量真实意向样本（高置信「模型判5/真值0」抽样
  #   12 条全部是标签错），故「0 分 F1 下降」很可能是模型在纠正错标，不是劣化。
  #
  # ⚠️ 适用前提：仅在「线上有意图(3-5分)占比 >= 60%」时开启才划算，见下方敏感性分析。
  #    留出集该占比为 70.8%，故本配置开启。若线上换成未筛选的新内容，必须重测。
  prior_correction_alpha: 0.8
  prior_file: "configs/intent_prior.json"   # 由 scripts/tune_intent_prior.py --save 生成
  #
  # ---------- 先验可信度问题（决定 alpha 的关键）----------
  # es_docs 由两个索引拼成，且索引按意图分数**完全切分**：
  #   lead_clue_score_ge3 (105,181 条) 只有 3/4/5 分
  #   lead_clue_score_lt3 ( 45,969 条) 只有 0/1/2 分
  # 所以「有意图占 69.6%」是**导入比例决定的**，不是自然分布，不能直接当业务先验。
  #
  # 敏感性分析（scripts/tune_intent_prior.py --sensitivity），固定各组内部分值构成、
  # 只改变两组混合比例后，alpha=1.0 相对不修正的二分 F1：
  #   线上有意图占比   30%     40%     50%     60%    69.6%   80%     90%
  #   不修正          .8449   .8641   .8726   .8872  .8963  .9098   .9206
  #   alpha=1.0      .8291   .8597   .8719   .8889  .9063  .9258   .9425
  #   结论             有害    有害    有害    更优    更优    更优    更优
  #
  # => 只在「有意图占比 >= 60%」时开启才划算。若线上跑的就是上述两个索引（70%），
  #    可设 1.0；若是未筛选的新内容（真实社交内容购物意图通常远低于 60%），保持 0.0。
  #    下行风险（30% 时 -1.6pp F1、MAE +0.057）大于上行收益。
  #
  # ---------- 当前取值 0.8 的依据与失效条件 ----------
  # 当前线上跑的就是 es_docs 那两个索引（留出集有意图占 70.8%），符合开启条件，故设 0.8
  # （取 0.8 而非 1.0：扫描显示 0.6~1.2 表现持平，0.8 略优且过校正风险更小）。
  #
  # ⚠️ 以下两种情况下必须重新扫描 alpha，当前 0.8 会失效：
  #   1. 线上数据换成未筛选的新内容（有意图占比 < 60% 时应改回 0.0）
  #   2. 改用「全量数据 + balanced 类别权重」重训后（见下方说明）
  #
  # ---------- 更彻底的解法：不要欠采样，改用类别权重 ----------
  # 本修正（prior shift）本质上是**在修补欠采样自己造成的先验扭曲**——是创可贴，不是治疗。
  # 2026-09-01 实测：_balance() 随机截断丢掉 55,578 条（36.8%），其中 3 分丢 51.5%
  # （28,522 条）、5 分丢 39.7%（16,297 条），导致 3 分训练先验 22.9% vs 真实 39.0%，
  # 偏差 −16.1pp。模型靠文本特征把预测拉回 35.6%，等于**用容量抵消人为扭曲**。
  # 治本方案：build_intent_data(balance=False) 关掉欠采样（数据量 81,602 -> 137,180），
  # 配合 train.py 加 balanced 类别权重（w_c = N / (C * n_c)）。
  # 注意：改用 balanced 权重后训练先验变均匀，届时推理反而**需要** alpha ≈ 1.0
  # 把先验拉回真实分布——那时先验校正是理论上必需的，而不是补丁。
