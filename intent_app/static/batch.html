<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 -apple-system, "PingFang SC", sans-serif; background: #f0f2f5; color: #1f2328; padding: 20px; }
  h2 { font-size: 18px; margin-bottom: 16px; }
  h3 { font-size: 15px; margin-bottom: 12px; }
  .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-end; flex-wrap: wrap; }
  .field { flex: 1; min-width: 120px; }
  .field label { display: block; font-size: 12px; color: #656d76; margin-bottom: 4px; }
  select { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; }
  select:focus { outline: none; border-color: #0969da; }
  .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-primary { background: #0969da; color: #fff; }
  .btn-primary:hover { background: #0860ca; }
  .btn-success { background: #1a7f37; color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eaecef; font-size: 13px; }
  th { font-size: 12px; color: #656d76; font-weight: 600; }
  .stat { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .stat.blue { background: #ddf4ff; color: #0969da; }
  .stat.green { background: #dafbe1; color: #1a7f37; }
  .stat.yellow { background: #fff8c5; color: #9a6700; }
  .stat.red { background: #ffebe9; color: #cf222e; }
  .stat.gray { background: #eaeef2; color: #656d76; }
  .empty { text-align: center; padding: 30px; color: #656d76; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .metric-box { text-align: center; padding: 16px; background: #f6f8fa; border-radius: 6px; }
  .metric-box .val { font-size: 28px; font-weight: 700; }
  .metric-box .lbl { font-size: 12px; color: #656d76; margin-top: 4px; }
  .confusion { border-collapse: collapse; margin: 0 auto; }
  .confusion th, .confusion td { text-align: center; padding: 6px 10px; border: 1px solid #d0d7de; font-size: 12px; }
  .confusion th { background: #f6f8fa; }
  .confusion td.diag { background: #dafbe1; }
  .confusion td.mis { background: #ffebe9; }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 12px; }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  .running { opacity: .6; pointer-events: none; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #d0d7de; border-top-color: #0969da; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h2>数据批跑</h2>

<!-- 模型选择 + 运行 -->
<div class="card">
  <div class="row">
    <div class="field" style="max-width:400px;">
      <label>选择模型</label>
      <select id="modelSelect" onchange="onModelChange()">
        <option value="">-- 请选择 --</option>
      </select>
    </div>
    <button class="btn btn-success" id="btnRun" onclick="runBatch()" disabled>开始批跑</button>
  </div>
  <div id="modelInfo" style="display:none; font-size:13px; color:#656d76;"></div>
</div>

<!-- 报告区 -->
<div id="reportArea" style="display:none;">
  <!-- 总览指标 -->
  <div class="card">
    <h3>批跑报告</h3>
    <div class="grid2" style="grid-template-columns: repeat(5, 1fr);">
      <div class="metric-box"><div class="val" id="rpTotal">-</div><div class="lbl">总条数</div></div>
      <div class="metric-box"><div class="val" id="rpCorrect" style="color:#1a7f37;">-</div><div class="lbl">正确数</div></div>
      <div class="metric-box"><div class="val" id="rpAcc" style="color:#0969da;">-</div><div class="lbl">准确率</div></div>
      <div class="metric-box"><div class="val" id="rpF1" style="color:#1a7f37;">-</div><div class="lbl">F1 (二分类)</div></div>
      <div class="metric-box"><div class="val" id="rpBinaryAcc" style="color:#0969da;">-</div><div class="lbl">二分类准确率</div></div>
    </div>
  </div>

  <!-- 二分类指标 -->
  <div class="card">
    <h3 id="binaryTitle">二分类指标</h3>
    <div class="grid2" style="grid-template-columns: repeat(4, 1fr);">
      <div class="metric-box"><div class="val" id="rpTP" style="font-size:20px;">-</div><div class="lbl">TP (真阳性)</div></div>
      <div class="metric-box"><div class="val" id="rpFP" style="font-size:20px; color:#cf222e;">-</div><div class="lbl">FP (假阳性)</div></div>
      <div class="metric-box"><div class="val" id="rpFN" style="font-size:20px; color:#cf222e;">-</div><div class="lbl">FN (假阴性)</div></div>
      <div class="metric-box"><div class="val" id="rpTN" style="font-size:20px;">-</div><div class="lbl">TN (真阴性)</div></div>
    </div>
    <div class="grid2" style="grid-template-columns: repeat(3, 1fr); margin-top:12px;">
      <div class="metric-box"><div class="val" id="rpPrecision" style="font-size:20px;">-</div><div class="lbl">精确率 (Precision)</div></div>
      <div class="metric-box"><div class="val" id="rpRecall" style="font-size:20px;">-</div><div class="lbl">召回率 (Recall)</div></div>
      <div class="metric-box"><div class="val" id="rpF1Detail" style="font-size:20px; color:#1a7f37;">-</div><div class="lbl">F1 Score</div></div>
    </div>
  </div>

  <!-- 混淆矩阵 -->
  <div class="card">
    <h3>混淆矩阵 (真实分数 vs 预测分数)</h3>
    <div id="confusionMatrix"></div>
  </div>

  <!-- 各分数段准确率 -->
  <div class="card">
    <h3>各分数段准确率</h3>
    <div id="scoreStats"></div>
  </div>
</div>

<!-- 结果明细 -->
<div class="card">
  <h3>批跑结果明细</h3>
  <div id="resultsList"><div class="empty">请先选择模型并运行批跑</div></div>
  <div id="resultsPager" class="pager"></div>
</div>

<script>
let currentModelId = null;
let resultsPage = 1;
let batchThreshold = 3;
let batchMaxScore = 5;

async function api(path, opts={}) {
  const res = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opts });
  return res.json();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ---- 加载模型列表 ----
async function loadModels() {
  const data = await api('/batch/api/models');
  const sel = document.getElementById('modelSelect');
  const oldVal = sel.value;
  sel.innerHTML = '<option value="">-- 请选择 --</option>' +
    (data.models||[]).filter(m => m.onnx_exists).map(m => {
      const p = m.params || {};
      return `<option value="${m.id}">#${m.id} ${esc(m.goal_name)} (${(m.accuracy*100).toFixed(1)}%) ep=${p.epochs||'-'} bs=${p.batch_size||'-'}</option>`;
    }).join('');
  if (oldVal) sel.value = oldVal;
}

function onModelChange() {
  currentModelId = document.getElementById('modelSelect').value;
  document.getElementById('btnRun').disabled = !currentModelId;
  document.getElementById('reportArea').style.display = 'none';
  document.getElementById('modelInfo').style.display = currentModelId ? 'block' : 'none';
  if (currentModelId) {
    resultsPage = 1;
    loadReport();
    loadResults();
  }
}

// ---- 批跑 ----
async function runBatch() {
  if (!currentModelId) return;
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnRun').innerHTML = '<span class="spinner"></span> 批跑中...';
  document.body.classList.add('running');
  try {
    const data = await api('/batch/api/run', {
      method:'POST', body: JSON.stringify({model_id: parseInt(currentModelId)})
    });
    if (data.error) { alert(data.error); return; }
    alert(data.message);
    loadReport();
    loadResults();
  } finally {
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnRun').textContent = '开始批跑';
    document.body.classList.remove('running');
  }
}

// ---- 加载报告 ----
async function loadReport() {
  if (!currentModelId) return;
  const data = await api(`/batch/api/report?model_id=${currentModelId}`);
  if (data.error) {
    document.getElementById('reportArea').style.display = 'none';
    return;
  }
  document.getElementById('reportArea').style.display = 'block';

  // 总览
  document.getElementById('rpTotal').textContent = data.total;
  document.getElementById('rpCorrect').textContent = data.correct;
  document.getElementById('rpAcc').textContent = (data.accuracy * 100).toFixed(1) + '%';

  // 二分类
  const b = data.binary;
  document.getElementById('rpTP').textContent = b.tp;
  document.getElementById('rpFP').textContent = b.fp;
  document.getElementById('rpFN').textContent = b.fn;
  document.getElementById('rpTN').textContent = b.tn;
  document.getElementById('rpPrecision').textContent = (b.precision * 100).toFixed(1) + '%';
  document.getElementById('rpRecall').textContent = (b.recall * 100).toFixed(1) + '%';
  document.getElementById('rpF1Detail').textContent = (b.f1 * 100).toFixed(1) + '%';
  document.getElementById('rpF1').textContent = (b.f1 * 100).toFixed(1) + '%';
  document.getElementById('rpBinaryAcc').textContent = (b.accuracy * 100).toFixed(1) + '%';

  // 动态配置
  const maxScore = data.max_score != null ? data.max_score : 5;
  const threshold = data.threshold != null ? data.threshold : 3;
  const scoreDefs = data.score_definitions || null;
  const numLabels = maxScore + 1;
  batchThreshold = threshold;
  batchMaxScore = maxScore;

  // 更新二分类标题
  document.getElementById('binaryTitle').textContent = `二分类指标 (${threshold}分以上=有意图)`;

  // 混淆矩阵
  const cm = data.confusion_matrix;
  function scoreLabel(s) {
    if (scoreDefs) { const d = scoreDefs.find(x => x.score === s); if (d) return `${s} ${d.label}`; }
    return `${s}分`;
  }
  let html = '<table class="confusion"><thead><tr><th>真实\\预测</th>';
  for (let i = 0; i < numLabels; i++) html += `<th>${scoreLabel(i)}</th>`;
  html += '<th>合计</th></tr></thead><tbody>';
  for (let i = 0; i < numLabels; i++) {
    let rowSum = cm[i].reduce((a, b) => a + b, 0);
    html += `<tr><th>${scoreLabel(i)}</th>`;
    for (let j = 0; j < numLabels; j++) {
      const cls = i === j ? 'diag' : (cm[i][j] > 0 ? 'mis' : '');
      html += `<td class="${cls}">${cm[i][j] || ''}</td>`;
    }
    html += `<td>${rowSum}</td></tr>`;
  }
  html += '<tr><th>合计</th>';
  for (let j = 0; j < numLabels; j++) {
    let colSum = cm.reduce((sum, row) => sum + row[j], 0);
    html += `<td>${colSum}</td>`;
  }
  html += `<td>${data.total}</td></tr></tbody></table>`;
  document.getElementById('confusionMatrix').innerHTML = html;

  // 各分数段
  const ss = data.score_stats || {};
  let ssHtml = '<table><thead><tr><th>分数</th><th>意图</th><th>总数</th><th>正确</th><th>准确率</th></tr></thead><tbody>';
  for (let s = 0; s <= maxScore; s++) {
    const info = ss[String(s)];
    if (info) {
      const accColor = info.accuracy >= 0.8 ? 'green' : info.accuracy >= 0.5 ? 'yellow' : 'red';
      const intentBadge = s >= threshold
        ? '<span class="stat green">有意图</span>'
        : '<span class="stat gray">无意图</span>';
      ssHtml += `<tr>
        <td><b>${scoreLabel(s)}</b></td>
        <td>${intentBadge}</td>
        <td>${info.total}</td>
        <td>${info.correct}</td>
        <td><span class="stat ${accColor}">${(info.accuracy * 100).toFixed(1)}%</span></td>
      </tr>`;
    }
  }
  ssHtml += '</tbody></table>';
  document.getElementById('scoreStats').innerHTML = ssHtml;
}

// ---- 结果明细 ----
async function loadResults() {
  if (!currentModelId) return;
  const data = await api(`/batch/api/results?model_id=${currentModelId}&page=${resultsPage}&size=50`);
  const el = document.getElementById('resultsList');
  if (!data.items || data.items.length === 0) {
    el.innerHTML = '<div class="empty">暂无批跑结果</div>';
    document.getElementById('resultsPager').innerHTML = '';
    return;
  }
  el.innerHTML = '<table><thead><tr>' +
    '<th>评论ID</th><th>作品内容</th><th>评论内容</th><th>真实分数</th><th>预测分数</th><th>置信度</th><th>结果</th>' +
    '</tr></thead><tbody>' + data.items.map(r => {
    const correct = r.is_correct;
    const trueLabel = r.true_score >= batchThreshold ? '有意图' : '无意图';
    const predLabel = r.predicted_score >= batchThreshold ? '有意图' : '无意图';
    return `
    <tr>
      <td>${r.comment_id}</td>
      <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(r.content_text)}">${esc(r.content_text)}</td>
      <td style="max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(r.comment)}">${esc(r.comment)}</td>
      <td><span class="stat ${r.true_score>=batchThreshold?'green':'gray'}">${r.true_score} (${trueLabel})</span></td>
      <td><span class="stat ${r.predicted_score>=batchThreshold?'green':'gray'}">${r.predicted_score} (${predLabel})</span></td>
      <td>${(r.confidence*100).toFixed(1)}%</td>
      <td>${correct ? '<span class="stat green">正确</span>' : '<span class="stat red">错误</span>'}</td>
    </tr>`;
  }).join('') + '</tbody></table>';
  renderPager('resultsPager', data.page, Math.ceil(data.total/data.size), (p) => {
    resultsPage = p; loadResults();
  });
}

// ---- 分页 ----
function renderPager(elId, page, totalPages, cb) {
  const el = document.getElementById(elId);
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  html += `<button class="btn btn-sm" ${page<=1?'disabled':''} onclick="__pager('${elId}',${page-1})">上一页</button>`;
  html += `<span> ${page} / ${totalPages} </span>`;
  html += `<button class="btn btn-sm" ${page>=totalPages?'disabled':''} onclick="__pager('${elId}',${page+1})">下一页</button>`;
  el.innerHTML = html;
  el._cb = cb;
}

function __pager(elId, page) {
  const el = document.getElementById(elId);
  if (el._cb) el._cb(page);
}

// ---- 初始化 ----
loadModels();
</script>
</body>
</html>
