<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 -apple-system, "PingFang SC", sans-serif; background: #f0f2f5; color: #1f2328; padding: 20px; }
  h2 { font-size: 18px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-end; flex-wrap: wrap; }
  .field { flex: 1; min-width: 200px; }
  .field label { display: block; font-size: 12px; color: #656d76; margin-bottom: 4px; }
  input, textarea, select { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; }
  input:focus, textarea:focus { outline: none; border-color: #0969da; }
  .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-primary { background: #0969da; color: #fff; }
  .btn-primary:hover { background: #0860ca; }
  .btn-danger { background: #cf222e; color: #fff; }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eaecef; }
  th { font-size: 12px; color: #656d76; font-weight: 600; }
  .stat { display: inline-block; background: #ddf4ff; color: #0969da; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-right: 4px; }
  .stat.warn { background: #fff8c5; color: #9a6700; }
  .stat.ok { background: #dafbe1; color: #1a7f37; }
  .empty { text-align: center; padding: 40px; color: #656d76; }
  .actions { display: flex; gap: 8px; }
</style>
</head>
<body>
<h2>意图目标管理</h2>

<div class="card">
  <h3 style="font-size:15px; margin-bottom:12px;">创建意图目标</h3>
  <div class="row">
    <div class="field">
      <label>意图名称（如：购物意向）</label>
      <input id="goalName" placeholder="输入意图名称">
    </div>
    <div class="field" style="flex:2;">
      <label>描述（可选）</label>
      <input id="goalDesc" placeholder="简要描述这个意图目标">
    </div>
    <button class="btn btn-primary" onclick="createGoal()">创建</button>
  </div>
</div>

<div class="card">
  <h3 style="font-size:15px; margin-bottom:12px;">意图目标列表</h3>
  <div id="goalList"><div class="empty">加载中...</div></div>
</div>

<script>
async function api(path, opts={}) {
  const res = await fetch(path, {
    headers: {'Content-Type': 'application/json'},
    ...opts
  });
  return res.json();
}

async function loadGoals() {
  const data = await api('/intent/api/list');
  const el = document.getElementById('goalList');
  if (!data.goals || data.goals.length === 0) {
    el.innerHTML = '<div class="empty">暂无意图目标，请先创建</div>';
    return;
  }
  el.innerHTML = '<table><thead><tr>' +
    '<th>ID</th><th>名称</th><th>描述</th><th>作品</th><th>评论</th><th>已标注</th><th>模型</th><th>操作</th>' +
    '</tr></thead><tbody>' + data.goals.map(g => `
    <tr>
      <td>${g.id}</td>
      <td><b>${esc(g.name)}</b></td>
      <td>${esc(g.description || '')}</td>
      <td><span class="stat">${g.content_count}</span></td>
      <td><span class="stat">${g.comment_count}</span></td>
      <td><span class="stat ${g.labeled_count >= 20 ? 'ok' : 'warn'}">${g.labeled_count}</span></td>
      <td><span class="stat">${g.model_count}</span></td>
      <td><div class="actions">
        <button class="btn btn-sm btn-primary" onclick="editGoal(${g.id}, '${esc(g.name)}', '${esc(g.description||'')}')">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteGoal(${g.id}, '${esc(g.name)}')">删除</button>
      </div></td>
    </tr>`).join('') + '</tbody></table>';
}

async function createGoal() {
  const name = document.getElementById('goalName').value.trim();
  const desc = document.getElementById('goalDesc').value.trim();
  if (!name) { alert('请输入意图名称'); return; }
  const data = await api('/intent/api/create', {
    method: 'POST', body: JSON.stringify({name, description: desc})
  });
  if (data.error) { alert(data.error); return; }
  document.getElementById('goalName').value = '';
  document.getElementById('goalDesc').value = '';
  loadGoals();
}

function editGoal(id, name, desc) {
  const newName = prompt('意图名称:', name);
  if (newName === null) return;
  const newDesc = prompt('描述:', desc);
  if (newDesc === null) return;
  api('/intent/api/update', {
    method: 'POST', body: JSON.stringify({id, name: newName.trim(), description: newDesc.trim()})
  }).then(data => {
    if (data.error) { alert(data.error); return; }
    loadGoals();
  });
}

function deleteGoal(id, name) {
  if (!confirm(`确定删除意图目标 "${name}"？\n关联的作品、评论、模型将一并删除！`)) return;
  api('/intent/api/delete', {
    method: 'POST', body: JSON.stringify({id})
  }).then(data => {
    if (data.error) { alert(data.error); return; }
    loadGoals();
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

loadGoals();
</script>
</body>
</html>
