<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 -apple-system, "PingFang SC", sans-serif; background: #f0f2f5; color: #1f2328; padding: 20px; }
  h2 { font-size: 18px; margin-bottom: 16px; }
  h3 { font-size: 15px; margin-bottom: 12px; }
  .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-end; flex-wrap: wrap; }
  .field { flex: 1; min-width: 120px; }
  .field label { display: block; font-size: 12px; color: #656d76; margin-bottom: 4px; }
  input, textarea, select { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #0969da; }
  .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-primary { background: #0969da; color: #fff; }
  .btn-primary:hover { background: #0860ca; }
  .btn-danger { background: #cf222e; color: #fff; }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eaecef; }
  th { font-size: 12px; color: #656d76; font-weight: 600; }
  .stat { display: inline-block; background: #ddf4ff; color: #0969da; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-right: 4px; }
  .stat.warn { background: #fff8c5; color: #9a6700; }
  .stat.ok { background: #dafbe1; color: #1a7f37; }
  .ext { font-size: 11px; color: #8a9199; margin-left: 6px; white-space: nowrap; }
  .empty { text-align: center; padding: 40px; color: #656d76; }
  .actions { display: flex; gap: 8px; }

  /* 分数定义编辑器 */
  .score-def-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .score-def-table th { background: #f6f8fa; text-align: center; padding: 6px 8px; font-size: 12px; border: 1px solid #d0d7de; }
  .score-def-table td { padding: 4px 8px; border: 1px solid #d0d7de; }
  .score-def-table .score-val { text-align: center; font-weight: 700; font-size: 16px; width: 50px; }
  .score-def-table .score-thr { text-align: center; width: 60px; }
  .score-def-table .thr-badge { display: inline-block; background: #fff8c5; color: #9a6700; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .score-def-table .thr-badge.has { background: #dafbe1; color: #1a7f37; }

  /* 编辑弹窗 */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.3); z-index: 999; display: flex; align-items: center; justify-content: center; }
  .modal { background: #fff; border-radius: 10px; padding: 24px; max-width: 640px; width: 90%; max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  .modal h3 { margin-bottom: 16px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h2>意图目标管理</h2>

<!-- 创建意图目标 -->
<div class="card">
  <h3>创建意图目标</h3>
  <div class="row">
    <div class="field" style="max-width:200px;">
      <label>意图名称（如：购物意向）</label>
      <input id="goalName" placeholder="输入意图名称">
    </div>
    <div class="field" style="flex:2;">
      <label>描述（可选）</label>
      <input id="goalDesc" placeholder="简要描述这个意图目标">
    </div>
    <div class="field" style="max-width:120px;">
      <label>最高分数</label>
      <select id="goalMaxScore" onchange="renderScoreDefs()">
        <option value="1">1（0-1，二分类）</option>
        <option value="2">2（0-2，三分类）</option>
        <option value="3">3（0-3，四分类）</option>
        <option value="4">4（0-4，五分类）</option>
        <option value="5" selected>5（0-5，六分类）</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
    </div>
  </div>

  <div style="margin-top:8px;">
    <label style="font-size:12px; color:#656d76;">分数定义（为每个分数填写标签和描述，选定意图阈值）</label>
    <table class="score-def-table" id="scoreDefTable">
      <thead><tr><th>分数</th><th>标签（简短）</th><th>描述（标注参照）</th><th>意图阈值</th></tr></thead>
      <tbody id="scoreDefBody"></tbody>
    </table>
  </div>

  <div style="margin-top:12px;">
    <button class="btn btn-primary" onclick="createGoal()">创建</button>
  </div>
</div>

<!-- 意图目标列表 -->
<div class="card">
  <h3>意图目标列表</h3>
  <p style="font-size:12px; color:#656d76; margin-bottom:12px;">统计口径：总数为 手工 + 外部(ES) 合并；列内右侧小字为 手工/外部 拆分。</p>
  <div id="goalList"><div class="empty">加载中...</div></div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal">
    <h3>编辑意图目标</h3>
    <div class="row">
      <div class="field" style="max-width:200px;">
        <label>意图名称</label>
        <input id="editName">
      </div>
      <div class="field" style="flex:2;">
        <label>描述</label>
        <input id="editDesc">
      </div>
      <div class="field" style="max-width:120px;">
        <label>最高分数</label>
        <select id="editMaxScore" onchange="renderEditScoreDefs()">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option><option value="9">9</option>
          <option value="10">10</option>
        </select>
      </div>
    </div>
    <table class="score-def-table" id="editScoreDefTable">
      <thead><tr><th>分数</th><th>标签</th><th>描述</th><th>意图阈值</th></tr></thead>
      <tbody id="editScoreDefBody"></tbody>
    </table>
    <div style="margin-top:16px; display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn btn-sm" onclick="closeEditModal()">取消</button>
      <button class="btn btn-sm btn-primary" onclick="submitEdit()">保存</button>
    </div>
  </div>
</div>

<script>
let editingGoalId = null;
let editThreshold = 3;

async function api(path, opts={}) {
  const res = await fetch(path, {
    headers: {'Content-Type': 'application/json'},
    ...opts
  });
  return res.json();
}

// ---- 分数定义编辑器 ----
function renderScoreDefs() {
  const maxScore = parseInt(document.getElementById('goalMaxScore').value);
  const defaultThreshold = Math.ceil((maxScore + 1) / 2);
  const tbody = document.getElementById('scoreDefBody');
  let html = '';
  let currentThreshold = parseInt(document.querySelector('input[name="createThreshold"]:checked')?.value || defaultThreshold);
  for (let s = 0; s <= maxScore; s++) {
    const isThr = s === currentThreshold;
    const defLabel = getDefaultLabel(s);
    html += `<tr>
      <td class="score-val">${s}</td>
      <td><input id="def_label_${s}" value="${defLabel}" style="padding:4px 8px; font-size:13px;"></td>
      <td><input id="def_desc_${s}" value="" placeholder="描述此分数的含义" style="padding:4px 8px; font-size:13px;"></td>
      <td class="score-thr"><label style="font-size:12px; cursor:pointer;"><input type="radio" name="createThreshold" value="${s}" ${isThr?'checked':''} onchange="updateThrBadges(this.value)"> ${s>=currentThreshold?'<span class="thr-badge has">有意图</span>':'<span class="thr-badge">无意图</span>'}</label></td>
    </tr>`;
  }
  tbody.innerHTML = html;
}

function updateThrBadges(thrStr) {
  const thr = parseInt(thrStr);
  const maxScore = parseInt(document.getElementById('goalMaxScore').value);
  document.querySelectorAll('#scoreDefBody tr').forEach((tr, i) => {
    const badge = tr.querySelector('.thr-badge');
    if (i >= thr) { badge.className = 'thr-badge has'; badge.textContent = '有意图'; }
    else { badge.className = 'thr-badge'; badge.textContent = '无意图'; }
  });
}

function getDefaultLabel(score) {
  const labels = {0:'无关',1:'弱关联',2:'有关注',3:'有倾向',4:'明确意向',5:'强烈意向',
    6:'极强意向',7:'极强意向',8:'极强意向',9:'极强意向',10:'极强意向'};
  return labels[score] || `分数${score}`;
}

function collectScoreDefs(prefix) {
  const maxScore = parseInt(document.getElementById(prefix + 'MaxScore').value);
  const defs = [];
  for (let s = 0; s <= maxScore; s++) {
    const label = document.getElementById(prefix + '_label_' + s)?.value || getDefaultLabel(s);
    const desc = document.getElementById(prefix + '_desc_' + s)?.value || '';
    defs.push({score: s, label: label.trim(), desc: desc.trim()});
  }
  const thrInput = document.querySelector(`input[name="${prefix}Threshold"]:checked`);
  const threshold = thrInput ? parseInt(thrInput.value) : Math.ceil((maxScore + 1) / 2);
  return {defs, threshold};
}

// ---- 创建 ----
async function createGoal() {
  const name = document.getElementById('goalName').value.trim();
  const desc = document.getElementById('goalDesc').value.trim();
  if (!name) { alert('请输入意图名称'); return; }
  const maxScore = parseInt(document.getElementById('goalMaxScore').value);
  const defs = [];
  for (let s = 0; s <= maxScore; s++) {
    const label = document.getElementById('def_label_' + s)?.value || getDefaultLabel(s);
    const d = document.getElementById('def_desc_' + s)?.value || '';
    defs.push({score: s, label: label.trim(), desc: d.trim()});
  }
  const thrInput = document.querySelector('input[name="createThreshold"]:checked');
  const threshold = thrInput ? parseInt(thrInput.value) : Math.ceil((maxScore + 1) / 2);
  const data = await api('/intent/api/create', {
    method: 'POST', body: JSON.stringify({
      name, description: desc,
      score_definitions: defs, intent_threshold: threshold
    })
  });
  if (data.error) { alert(data.error); return; }
  document.getElementById('goalName').value = '';
  document.getElementById('goalDesc').value = '';
  renderScoreDefs();
  loadGoals();
}

// ---- 列表 ----
async function loadGoals() {
  const data = await api('/intent/api/list');
  const el = document.getElementById('goalList');
  if (!data.goals || data.goals.length === 0) {
    el.innerHTML = '<div class="empty">暂无意图目标，请先创建</div>';
    return;
  }
  el.innerHTML = '<table><thead><tr>' +
    '<th>ID</th><th>名称</th><th>描述</th><th>评分</th><th>作品</th><th>评论</th><th>已标注</th><th>模型</th><th>操作</th>' +
    '</tr></thead><tbody>' + data.goals.map(g => {
    const defs = g.score_definitions || [];
    const maxScore = defs.length > 0 ? Math.max(...defs.map(d=>d.score)) : 5;
    const threshold = g.intent_threshold != null ? g.intent_threshold : Math.ceil((maxScore+1)/2);
    const scoreInfo = `0-${maxScore}分 / 阈值${threshold}`;
    return `
    <tr>
      <td>${g.id}</td>
      <td><b>${esc(g.name)}</b></td>
      <td>${esc(g.description || '')}</td>
      <td><span class="stat">${scoreInfo}</span></td>
      <td><span class="stat">${g.work_total}</span><small class="ext">${g.content_count}/${g.es_work_count}</small></td>
      <td><span class="stat">${g.comment_total}</span><small class="ext">${g.comment_count}/${g.es_comment_count}</small></td>
      <td><span class="stat ${g.labeled_total >= 20 ? 'ok' : 'warn'}">${g.labeled_total}</span><small class="ext">${g.labeled_count}/${g.es_labeled_count}</small></td>
      <td><span class="stat">${g.model_count}</span></td>
      <td><div class="actions">
        <button class="btn btn-sm btn-primary" onclick="openEditModal(${g.id})">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteGoal(${g.id}, '${esc(g.name)}')">删除</button>
      </div></td>
    </tr>`}).join('') + '</tbody></table>';
}

// ---- 编辑弹窗 ----
async function openEditModal(goalId) {
  editingGoalId = goalId;
  const data = await api(`/intent/api/detail?id=${goalId}`);
  if (data.error) { alert(data.error); return; }
  document.getElementById('editName').value = data.name || '';
  document.getElementById('editDesc').value = data.description || '';
  const defs = data.score_definitions || [];
  const maxScore = defs.length > 0 ? Math.max(...defs.map(d=>d.score)) : 5;
  document.getElementById('editMaxScore').value = String(maxScore);
  editThreshold = data.intent_threshold != null ? data.intent_threshold : Math.ceil((maxScore+1)/2);
  renderEditScoreDefs(defs);
  document.getElementById('editModal').classList.remove('hidden');
}

function renderEditScoreDefs(existingDefs) {
  const maxScore = parseInt(document.getElementById('editMaxScore').value);
  const defMap = {};
  if (existingDefs) existingDefs.forEach(d => defMap[d.score] = d);
  const tbody = document.getElementById('editScoreDefBody');
  let html = '';
  for (let s = 0; s <= maxScore; s++) {
    const def = defMap[s] || {};
    const label = def.label || getDefaultLabel(s);
    const desc = def.desc || '';
    const isThr = s === editThreshold;
    html += `<tr>
      <td class="score-val">${s}</td>
      <td><input id="edit_label_${s}" value="${esc(label)}" style="padding:4px 8px; font-size:13px;"></td>
      <td><input id="edit_desc_${s}" value="${esc(desc)}" placeholder="描述此分数的含义" style="padding:4px 8px; font-size:13px;"></td>
      <td class="score-thr"><label style="font-size:12px; cursor:pointer;"><input type="radio" name="editThreshold" value="${s}" ${isThr?'checked':''} onchange="editThreshold=parseInt(this.value); updateEditThrBadges()"> ${s>=editThreshold?'<span class="thr-badge has">有意图</span>':'<span class="thr-badge">无意图</span>'}</label></td>
    </tr>`;
  }
  tbody.innerHTML = html;
}

function updateEditThrBadges() {
  const maxScore = parseInt(document.getElementById('editMaxScore').value);
  document.querySelectorAll('#editScoreDefBody tr').forEach((tr, i) => {
    const badge = tr.querySelector('.thr-badge');
    if (i >= editThreshold) { badge.className = 'thr-badge has'; badge.textContent = '有意图'; }
    else { badge.className = 'thr-badge'; badge.textContent = '无意图'; }
  });
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
  editingGoalId = null;
}

async function submitEdit() {
  if (!editingGoalId) return;
  const name = document.getElementById('editName').value.trim();
  const desc = document.getElementById('editDesc').value.trim();
  const maxScore = parseInt(document.getElementById('editMaxScore').value);
  const defs = [];
  for (let s = 0; s <= maxScore; s++) {
    const label = document.getElementById(`edit_label_${s}`)?.value || getDefaultLabel(s);
    const descVal = document.getElementById(`edit_desc_${s}`)?.value || '';
    defs.push({score: s, label: label.trim(), desc: descVal.trim()});
  }
  const data = await api('/intent/api/update', {
    method: 'POST', body: JSON.stringify({
      id: editingGoalId, name, description: desc,
      score_definitions: defs, intent_threshold: editThreshold
    })
  });
  if (data.error) { alert(data.error); return; }
  closeEditModal();
  loadGoals();
}

async function deleteGoal(id, name) {
  if (!confirm(`确定删除意图目标 "${name}"？\n关联的作品、评论、模型将一并删除！`)) return;
  const data = await api('/intent/api/delete', {
    method: 'POST', body: JSON.stringify({id})
  });
  if (data.error) { alert(data.error); return; }
  loadGoals();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ---- 初始化 ----
renderScoreDefs();
loadGoals();
</script>
</body>
</html>
